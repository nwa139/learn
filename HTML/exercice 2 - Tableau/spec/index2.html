<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>table</title>
	<style>
		table {
			border: 3px grey solid;
			background-color: #58D3F7;
		}
		td {
			border: 1px black solid;
		}
	</style>
</head>
<body>
<table>
	<tr>
		<td colspan="2">Colonnes 1 et 2 fusionnées</td>
		<td>Colonne 3</td>
		<td colspan="2">Colonnes 4 et 5 fusionnées</td>
	</tr>
	<tr>
		<td>Colonne 1</td>
		<td>Colonne 2</td>
		<td>Colonne 3</td>
		<td>Colonne 4</td>
		<td>Colonne 5</td>
	</tr>
	<tr>
		<td>Colonne 1</td>
		<td colspan="3">Colonnes 2,3,4 fusionnées</td>
		<td>Colonne 5</td>
	</tr>
</table>
</body>
</html>
